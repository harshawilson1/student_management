<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Courses</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="p-4">
<button id="sidebarToggle" class="btn btn-outline-primary">☰ Menu</button>


<!-- ===== NAVBAR ===== -->
<!-- Sidebar -->
<div id="mySidebar" class="erp-navbar">
  <div class="nav-left">
    <a class="logo" href="/dashboard">ERP Dashboard</a>
    <a href="/students">Students</a>
    <a href="/course_requests">Course Requests</a>
    <a href="/courses">Courses</a>
                 <a href="{{ url_for('add_material') }}">Add Materials</a>
    <a href="/fees">Fees</a>
    <a href="/points">Points</a>
    <a href="/top_students">Top Students</a>

  </div>
  <div class="nav-right">
    <a href="/profile" class="btn btn-primary">Profile</a>

    <a href="/logout" class="btn btn-primary">Logout</a>
  </div>
</div>
<div class="container">
<div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Courses</h2>
    <a href="{{ url_for('add_course') }}" class="btn btn-success">+ Add Course</a>
</div>

<table class="table table-striped table-hover">
  <thead class="table-dark">
    <tr>
      <th>ID</th>
      <th>Name</th>
      <th>Description</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody>
    {% for c in courses %}
    <tr>
      <td>{{ c.id }}</td>
      <td>{{ c.name }}</td>
      <td>{{ c.description }}</td>
      <td>
        <a href="{{ url_for('edit_course', course_id=c.id) }}" class="btn btn-sm btn-warning">Edit</a>
        <a href="{{ url_for('delete_course', course_id=c.id) }}" class="btn btn-sm btn-danger"
           onclick="return confirm('Are you sure you want to delete this course?');">Delete</a>
      </td>
    </tr>
    {% else %}
    <tr>
      <td colspan="4" class="text-center">No courses found</td>
    </tr>
    {% endfor %}
  </tbody>
</table>
<a href="/dashboard" class="btn btn-secondary mt-3">Back to Dashboard</a>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/theme.js') }}"></script>

</body>
</html>
