<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Course</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">
<button id="sidebarToggle" class="btn btn-outline-primary">☰ Menu</button>


<!-- ===== NAVBAR ===== -->
<!-- Sidebar -->
<div id="mySidebar" class="erp-navbar">
  <div class="nav-left">
    <a class="logo" href="/dashboard">ERP Dashboard</a>
    <a href="/students">Students</a>
    <a href="/course_requests">Course Requests</a>
    <a href="/courses">Courses</a>
            <a href="{{ url_for('add_material') }}">Add Materials</a>
    <a href="/fees">Fees</a>
    <a href="/points">Points</a>
    <a href="/top_students">Top Students</a>

  </div>
  <div class="nav-right">
    <a href="/logout" class="btn btn-primary">Logout</a>
  </div>
</div>
<div class="container">
    <h2>Edit Course</h2>
    <form method="POST">
        <div class="mb-3">
            <label class="form-label">Course Name</label>
            <input type="text" name="name" class="form-control" value="{{ course[1] }}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea name="description" class="form-control">{{ course[2] }}</textarea>
        </div>
        <button type="submit" class="btn btn-primary">Update</button>
        <a href="/courses" class="btn btn-secondary">Back</a>
    </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/theme.js') }}"></script>

</body>
</html>
