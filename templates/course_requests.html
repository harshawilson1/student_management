<!DOCTYPE html>
<html>  
<head>
    <title>pending Courses request</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
    <style>
        body {
            padding: 20px;
            background-color: #f8f9fa;
        }
        h2 {
            margin-bottom: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 12px;
            border: 1px solid #dee2e6;
            text-align: left;
        }
        th {
            background-color: #343a40;
            color: white;
        }
        tr:nth-child(even) {
            background-color: #e9ecef;
        }
        a.btn {
            margin-right: 10px;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.1);
            border-radius: 4px;
            padding: 6px 12px;
            text-decoration: none;
            color: #007bff;
            border: 1px solid #007bff;
        }
        div.nav-right a {
            margin-left: 10px;
        }

      </style>
</head>
<body>
    <button id="sidebarToggle" class="btn btn-outline-primary">☰ Menu</button>


<!-- ===== NAVBAR ===== -->
<!-- Sidebar -->
<div id="mySidebar" class="erp-navbar">
  <div class="nav-left">
    <a class="logo" href="/dashboard">ERP Dashboard</a>
<a href="/students">Students</a>
<a href="/course_requests">Course Requests</a>
<a href="/courses">Courses</a>
<a href="{{ url_for('add_material') }}">Add Materials</a>
<a href="/fees">Fees</a>
<a href="/points">Points</a>
<a href="/top_students">Top Students</a>

  </div>
  <div class="nav-right">

    <a href="/logout" class="btn btn-primary">Logout</a>
  </div>
</div>
<div class="container mt-4">
<h2>Pending Course Requests</h2>

<table class="table table-striped table-hover">
<tr>
    <th>Student</th>
    <th>Course</th>
    <th>Action</th>
</tr>

{% for r in requests %}
<tr>
    <td>{{ r.student }}</td>
    <td>{{ r.course }}</td>
    <td>
        <a class="btn btn-success" href="/approve_course/{{ r.student_id }}/{{ r.course_id }}">Approve</a>
        <a class="btn btn-danger" href="/reject_course/{{ r.student_id }}/{{ r.course_id }}">Reject</a>
    </td>
</tr>
{% endfor %}
</table>
            <a href="/dashboard" class="btn btn-secondary mt-3">Back to Dashboard</a>

</div>
<script src="{{ url_for('static', filename='js/theme.js') }}"></script>

</body>
</html>
