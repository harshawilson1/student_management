<!DOCTYPE html>
<html>
<head>
    <title>Student Login</title>
<!--<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"> -->
 <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

</head>
<body class="page-dark">
        <h2 class="mb-4 text-center">Student management System</h2>

    
<div class="container" style="max-width:400px;">
        <img src="{{ url_for('static', filename='images/man.png') }}" alt="Student Icon" class="student-icon mb-3">
    <h3 class="text-center mb-4">Student Login</h3>
        <div class="d-flex justify-content-between mb-4">
        <a href="/student_login" class="btn btn-outline-primary w-50 me-2">Student Login</a>
        <a href="/admin_login" class="btn btn-outline-danger w-50">Admin Login</a>
    </div>

    <form method="POST">
        <input type="hidden" name="role" value="student">
<div class="alert">
        {% if error %}
    <div class="alert alert-danger">{{ error }}</div>
    {% endif %}
        </div>

<div class="mb-3"> <label>Student Username</label> <input type="text" name="name" class="form-control" required> </div>


        <div class="mb-3">
            <label>Password</label>
            <input type="password" name="password" class="form-control" required>
        </div>

        <button class="btn btn-primary w-100">Login</button>
    </form>
</div>
</body>
</html>
