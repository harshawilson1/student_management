<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Study Material</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/student_style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<body>
<button id="sidebarToggle" class="btn btn-outline-primary">☰ Menu</button>
<div class="erp-layout">

    <div id="mySidebar" class="erp-navbar">
        <div class="nav-left">
            <a class="logo" href="/dashboard">ERP Dashboard</a>
            <a href="/students">Students</a>
            <a href="/course_requests">Course Requests</a>
            <a href="/courses">Courses</a>
            <a href="{{ url_for('add_material') }}">Add Materials</a>
            <a href="/attendance">Attendance</a>
            <a href="/fees">Fees</a>
            <a href="/points">Points</a>
            <a href="/top_students">Top Students</a>
        </div>
        <div class="nav-right">
            <a href="/profile" class="btn btn-primary">Profile</a>
            <a href="/logout" class="btn btn-primary">Logout</a>
        </div>
    </div>

    <!-- THIS WAS MISSING -->
    <div class="content">
        <div class="container mt-5">
           

            <h3>Add Study Material</h3>
<a href="/dashboard" class="btn btn-secondary">Back to Dashboard</a> 
            <form method="POST" enctype="multipart/form-data">
                <div class="mb-3">
                    <label>Subject</label>
                    <select name="course_id" class="form-control" required>
                        <option value="">-- Select Subject --</option>
                        {% for course in courses %}
                            <option value="{{ course.id }}">{{ course.name }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="mb-3">
                    <label>Title</label>
                    <input type="text" name="title" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label>Upload File</label>
                    <input type="file" name="file" class="form-control" required>
                </div>

                <button class="btn btn-success">Upload Material</button>
            </form>
        </div>
  
    
  </div>
</div>

<script src="{{ url_for('static', filename='js/theme.js') }}" defer></script>
</body>

</html>
