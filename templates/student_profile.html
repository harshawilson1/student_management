<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>My Profile</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<style>
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .profile-card {
            background-color: #ffffff;
            border-radius: 15px;
            padding: 30px;
            max-width: 900px;
            margin: 50px auto;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            gap: 30px;
            flex-wrap: wrap;
        }

        .profile-image {
            flex: 1 1 200px;
            justify-content: center;
            align-items: center;
        }

        .profile-image img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #3498db;
        }

        .profile-details {
            flex: 2 1 400px;
            text-align:left;
        }

        .profile-details h3 {
            font-weight: bold;
            margin-bottom: 20px;
            text-align:left;
        }

        .profile-details p {
            font-size: 16px;
            margin: 5px 0;
        }

        .profile-details strong {
            color: #2c3e50;
        }
        .profile-set {
            text-align: center;
           display: flex;
              flex-direction: row;
                gap: 20px;
                align-items: center;
                justify-content: center;

        }

        .btn-back {
            margin-top: 20px;
        }

        @media(max-width: 768px){
            .profile-card {
                flex-direction: column;
                align-items: center;
                text-align: center;
            }
            .profile-details {
                flex: unset;
            }
        }
</style>
</head>
<body>

<div class="container">
    <div class="profile-card">
        <div class="profile-card text-center">
            <div class="profile-image mb-3">
                <img src="{{ url_for('static', filename=student.profile_pic or 'uploades/profile/default_profile.png')}}" alt="profile_picture">
        <h2>My Profile</h2>

{% with messages = get_flashed_messages() %}
  {% if messages %}
    {% for message in messages %}
      <div class="alert alert-success alert-dismissible fade show" role="alert">
        {{ message }}
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
      </div>
    {% endfor %}
  {% endif %}
{% endwith %}


        <button class="btn btn-primary btn-edit" id="editBtn">Edit Profile</button>
<a href="/student_dashboard" class="btn btn-secondary btn-back">Back to Dashboard</a>
            </div>
        <form method="POST" id="profileForm">
            <div class="mb-2">
                <label>Name</label>
                <input type="text" class="form-control" name="name" value="{{ student.name }}" readonly>
            </div>
            <div class="mb-2">
                <label>Email</label>
                <input type="email" class="form-control" name="email" value="{{ student.email }}" readonly>
            </div>
            <div class="mb-2">
                <label>DOB</label>
                <input type="date" class="form-control" name="dob" value="{{ student.dob }}" readonly>
            </div>
            <div class="mb-2">
                <label>Phone</label>
                <input type="text" class="form-control" name="phone" value="{{ student.phone }}" readonly>
            </div>
            <div class="mb-2">
                <label>Address</label>
                <input type="text" class="form-control" name="address" value="{{ student.address }}" readonly>
            </div>
            <div class="mb-2">
                <label>Major</label>
                <input type="text" class="form-control" name="major" value="{{ student.major }}" readonly>
            </div>
            <div class="mb-2">
                <label>GPA</label>
                <input type="number" step="0.01" class="form-control" name="gpa" value="{{ student.gpa }}" readonly>
            </div>
            <div class="mb-2">
                <label>Completed Credits</label>
                <input type="number" class="form-control" name="completed_credits" value="{{ student.completed_credits }}" readonly>
            </div>
            <div class="mb-2">
                <label>Extracurriculars</label>
                <input type="text" class="form-control" name="extracurriculars" value="{{ student.extracurriculars }}" readonly>
            </div>

            <button type="submit" class="btn btn-success" id="saveBtn" style="display:none;">Save Changes</button>
        </form>
    </div>
</div>

<script src="{{ url_for('static', filename='js/profile.js') }}"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
