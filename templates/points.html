<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Points System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">
</head>
<body class="p-4 bg-light">
<button id="sidebarToggle" class="btn btn-outline-primary">☰ Menu</button>
<!-- ===== NAVBAR ===== -->
<!-- Sidebar -->
<div id="mySidebar" class="erp-navbar">
  <div class="nav-left">
    <a class="logo" href="/dashboard">ERP Dashboard</a>
<a href="/students">Students</a>
<a href="/course_requests">Course Requests</a>
<a href="/courses">Courses</a>
            <a href="{{ url_for('add_material') }}">Add Materials</a>
<a href="/fees">Fees</a>
<a href="/points">Points</a>
<a href="/top_students">Top Students</a>
  </div>
  <div class="nav-right">
    <a href="/logout" class="btn btn-primary">Logout</a>
  </div>
</div>
<div class="container">
    <h2 class="mb-4">Student Points System</h2>
    <a href="/dashboard" class="btn btn-secondary mb-3">Back to Dashboard</a>
   <table class="table table-striped table-bordered table-hover align-middle text-center">
        <thead class="table-dark">
            <tr>
                <th>Student</th>
                <th>Points</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            {% for student in students %}
            <tr>
                <td>{{ student.name }}</td>
                <td>
                    <form action="/update_points/{{ student.id }}" method="POST" class="d-flex justify-content-center align-items-center gap-2">
    <input type="number" name="points" value="{{ student.points }}" min="0" class="form-control" style="width:80px;">
    <!-- Subject Dropdown -->
    <select name="subject_id" class="form-select" style="width:150px;">
        {% for subject in subjects %}
            <option value="{{ subject.id }}">{{ subject.name }}</option>
        {% endfor %}
    </select>
    <button type="submit" class="btn btn-success btn-sm">Update</button>
</form>
                </td>
                <td>
                    <a href="/top_students" class="btn btn-primary btn-sm">View Top</a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
<script src="/static/js/theme.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
